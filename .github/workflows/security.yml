# Security scanning: SAST, dependency review and secret detection.
#
# Split from ci.yml because these have different failure semantics. CI failing
# means "this change is broken"; a scheduled security run failing usually means
# "the world changed" — a new advisory against a dependency nobody touched.
# Mixing them trains people to ignore red builds.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory surfaces without anyone pushing.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the rules that matter for this product:
          # injection, unsafe deserialization, weak crypto, sensitive logging.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependencies:
    name: Dependency audit (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the toolchain this project is developed and deployed with.
          # Node 22 ships npm 10, which crashes with "Exit handler never called!"
          # on this npm 11-generated lockfile — CI diverging from the dev
          # environment is exactly the failure CI is supposed to prevent.
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Runtime dependencies are what an attacker can reach, so they gate the
      # build. Dev-only advisories are reported but do not fail: a vulnerable
      # test runner is worth fixing, not worth blocking a security patch over.
      - name: Audit runtime dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        if: always()
        run: npm audit || true

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed in a later commit is still a
          # leaked credential, and this project has handled real Zoom secrets.
          fetch-depth: 0

      # Invoked directly rather than through gitleaks/gitleaks-action, which
      # derives a commit range from the event. On a merge-commit push that
      # range resolved to nothing: a run reported "no leaks found" having
      # scanned 0 commits, which is a green check that proves nothing. A full
      # scan of this repository takes well under a second, so there is no
      # reason to scan anything less.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3

      - name: Scan the full history for secrets
        run: |
          gitleaks detect --source . --redact -v \
            --report-format sarif --report-path gitleaks.sarif \
            --log-level info | tee gitleaks.log
          # gitleaks exits non-zero on a finding, which should fail the job.
          exit "${PIPESTATUS[0]}"

      - name: Confirm the scan actually covered the history
        if: always()
        run: |
          # A scan of zero commits is the failure mode this job is guarding
          # against, and it otherwise looks identical to a clean result.
          if ! grep -qE "[1-9][0-9]* commits scanned" gitleaks.log; then
            echo "::error::gitleaks scanned no commits — the scan did not run over the history"
            exit 1
          fi

      - name: Upload secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks.sarif
            gitleaks.log
          retention-days: 90
